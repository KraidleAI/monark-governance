# MONARK engine CI (HIKAE + Genkan). Rewritten on 2026-11-04 when the repository was refocused on the engine: tests,
# lint, dependency audit, and the Genkan Lean kernel. Job names are kept from the previous workflow so that required
# status checks keep reporting. Pinned action SHAs (GitHub API git/ref/tags, unchanged from the previous workflow):
#   actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
#   actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0

name: gates
on:
  pull_request:

permissions:
  contents: read

jobs:
  g3-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install (lockfile must be present and consistent)
        run: npm ci
      - name: Vocabulary gate, strict typecheck, tests
        run: npm run gate:vocab && npm run typecheck && npm test

  g4-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: eslint, then the test-debt ratchet
        run: npm run lint && npm run lint:ratchet

  g6-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Dependency audit (high and above = failure)
        run: npm audit --audit-level=high

  g3-genkan:
    # The Genkan kernel under its pinned toolchain: the source audit before any Lean runs; the Lean 4.32.1 release for Linux by curl,
    # held to its sha256, unpacked as <ELAN_HOME>/toolchains/<name> (no elan, no installer); the build; each module replayed by the
    # toolchain's leanchecker; the axiom records and their audit; an empty request refused (exit code 3); the tests under that toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Source audit of the kernel, before any Lean runs (apps/genkan/scripts/audit.mjs --source-only)
        run: node apps/genkan/scripts/audit.mjs --source-only
      # One name at a time: bash's `command -v a b` succeeds when any one of the names is found.
      - name: The tools of the toolchain steps (curl, tar, zstd, sha256sum)
        run: for t in curl tar zstd sha256sum; do command -v "$t" || { echo "::error::$t is missing"; exit 1; }; done
      - name: Fetch the Lean 4.32.1 release for Linux
        run: curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --output "$RUNNER_TEMP/lean-4.32.1-linux.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.32.1/lean-4.32.1-linux.tar.zst
      - name: Hold the archive to its pinned sha256
        run: echo "57d5c062a6b4bae6fba511a1704aa124dff461c37d0fc94585637fbb7d951b50  $RUNNER_TEMP/lean-4.32.1-linux.tar.zst" | sha256sum -c -
      - name: Unpack it as the pinned toolchain of an ELAN_HOME, then check its lake
        run: |
          mkdir -p "$RUNNER_TEMP/elan/toolchains/leanprover--lean4---v4.32.1"
          tar --zstd -xf "$RUNNER_TEMP/lean-4.32.1-linux.tar.zst" -C "$RUNNER_TEMP/elan/toolchains/leanprover--lean4---v4.32.1" --strip-components=1
          test -x "$RUNNER_TEMP/elan/toolchains/leanprover--lean4---v4.32.1/bin/lake"
      - name: The temp dir of the wrapper
        run: mkdir -p "$RUNNER_TEMP/genkan"
      - name: Build the kernel with the pinned lake (apps/genkan/scripts/lake.mjs)
        run: ELAN_HOME="$RUNNER_TEMP/elan" node apps/genkan/scripts/lake.mjs build
      - name: Replay the kernel's modules with the pinned leanchecker, against environment hacking (apps/genkan/scripts/records.mjs --replay)
        run: ELAN_HOME="$RUNNER_TEMP/elan" node apps/genkan/scripts/records.mjs --replay
      - name: The axiom records of main and each theorem, read from the built kernel (apps/genkan/scripts/records.mjs)
        run: ELAN_HOME="$RUNNER_TEMP/elan" node apps/genkan/scripts/records.mjs --out "$RUNNER_TEMP/genkan/axioms.txt"
      - name: The audit of those records (apps/genkan/scripts/audit.mjs --axioms-from)
        run: node apps/genkan/scripts/audit.mjs --axioms-from "$RUNNER_TEMP/genkan/axioms.txt"
      - name: The kernel refuses an empty request (exit code 3)
        run: |
          status=0
          apps/genkan/kernel/.lake/build/bin/genkan-kernel < /dev/null || status=$?
          echo "genkan-kernel exit code: $status"
          [ "$status" -eq 3 ] || { echo "::error::the kernel must exit with code 3 on an empty request"; exit 1; }
      - name: Install (lockfile must be present and consistent)
        run: npm ci
      - name: The Genkan tests, the kernel ones under the pinned toolchain
        env:
          ELAN_HOME: ${{ runner.temp }}/elan
        run: npm run test:genkan
